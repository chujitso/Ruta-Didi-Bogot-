<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DiDi Farma Navigator - Bogotá</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ========== RESET & VARIABLES ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #ff5200;
      --primary-dark: #e04500;
      --bg: #0a0e1a;
      --bg-card: #141b2d;
      --bg-card-hover: #1a233a;
      --text: #f0f4ff;
      --text-secondary: #94a3b8;
      --border: #2a3450;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #8b5cf6;

      --header-height: 56px;
      --bottom-nav-height: 64px;
    }

    body {
      font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

    /* ========== HEADER ========== */
    .app-header {
      height: var(--header-height);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 100;
    }

    .app-header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
    }

    .app-header .logo i {
      color: var(--primary);
      font-size: 20px;
    }

    .app-header .stats {
      display: flex;
      gap: 12px;
      font-size: 11px;
    }

    .app-header .stat-item {
      text-align: center;
    }

    .app-header .stat-item .number {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .app-header .stat-item .label {
      color: var(--text-secondary);
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ========== MAIN CONTENT ========== */
    .app-main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ========== MAPA ========== */
    #map {
      flex: 1;
      min-height: 200px;
      background: #1a233a;
      border-bottom: 2px solid var(--border);
    }

    /* ========== PANEL DE INFORMACIÓN ========== */
    .info-panel {
      background: var(--bg-card);
      height: 40%;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      border-top: 2px solid var(--border);
      transition: height 0.3s ease;
    }

    .info-panel .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .info-panel .panel-header h2 {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-header .view-toggle {
      display: flex;
      gap: 4px;
    }

    .panel-header .view-toggle button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .panel-header .view-toggle button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .panel-header .view-toggle button:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      color: #fff;
    }

    /* ========== CONTENIDO DEL PANEL ========== */
    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .panel-content .section {
      display: none;
    }

    .panel-content .section.active {
      display: block;
    }

    /* ========== ZONAS ESTRATÉGICAS ========== */
    .zone-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .zone-card {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      border-left: 4px solid var(--green);
      cursor: pointer;
      transition: all 0.2s;
    }

    .zone-card:hover {
      transform: translateX(4px);
      background: var(--bg-card-hover);
    }

    .zone-card .zone-name {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .zone-card .zone-detail {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .zone-card .zone-detail i {
      width: 14px;
      color: var(--primary);
    }

    .zone-card .zone-badge {
      font-size: 9px;
      padding: 1px 8px;
      border-radius: 10px;
      display: inline-block;
      margin-top: 4px;
    }

    .zone-badge.high { background: var(--green); color: #000; }
    .zone-badge.medium { background: var(--yellow); color: #000; }
    .zone-badge.low { background: var(--red); color: #fff; }

    /* ========== FARMACIAS ========== */
    .pharmacy-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pharmacy-item {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pharmacy-item:hover {
      background: var(--bg-card-hover);
      transform: translateX(4px);
    }

    .pharmacy-item .pharm-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pharmacy-item .pharm-name {
      font-size: 13px;
      font-weight: 600;
    }

    .pharmacy-item .pharm-address {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .pharmacy-item .pharm-type {
      font-size: 9px;
      background: var(--blue);
      color: #fff;
      padding: 1px 8px;
      border-radius: 10px;
    }

    .pharmacy-item .pharm-distance {
      font-size: 10px;
      color: var(--green);
      font-weight: 600;
    }

    /* ========== RUTAS ========== */
    .route-item {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .route-item .route-title {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .route-item .route-detail {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      gap: 12px;
    }

    .route-item .route-detail i {
      width: 14px;
    }

    /* ========== RECOMENDACIONES ========== */
    .recommendation-box {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      border-left: 4px solid var(--primary);
      margin-bottom: 10px;
    }

    .recommendation-box .rec-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--primary);
    }

    .recommendation-box .rec-body {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      top: 70px;
      right: 16px;
      background: var(--bg-card);
      border: 1px solid var(--primary);
      border-radius: 12px;
      padding: 14px 20px;
      box-shadow: var(--shadow);
      z-index: 1000;
      max-width: 280px;
      transform: translateX(120%);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 13px;
    }

    .toast.show {
      transform: translateX(0);
    }

    .toast .toast-title {
      font-weight: 700;
      color: var(--primary);
    }

    .toast .toast-body {
      color: var(--text-secondary);
      font-size: 12px;
      margin-top: 4px;
    }

    /* ========== BOTTOM NAV ========== */
    .bottom-nav {
      height: var(--bottom-nav-height);
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex-shrink: 0;
    }

    .bottom-nav .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--text-secondary);
      font-size: 9px;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 8px;
      transition: all 0.2s;
      background: transparent;
      border: none;
    }

    .bottom-nav .nav-item i {
      font-size: 18px;
    }

    .bottom-nav .nav-item.active {
      color: var(--primary);
    }

    .bottom-nav .nav-item:hover {
      color: var(--text);
    }

    /* ========== CONTROLES DEL MAPA ========== */
    .map-controls {
      position: absolute;
      bottom: 80px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }

    .map-controls button {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 16px;
      box-shadow: var(--shadow);
    }

    .map-controls button:hover {
      background: var(--primary);
      transform: scale(1.05);
    }

    /* ========== RESPONSIVE ========== */
    @media (min-width: 768px) {
      .app-main {
        flex-direction: row;
      }
      #map {
        flex: 2;
        border-bottom: none;
        border-right: 2px solid var(--border);
      }
      .info-panel {
        flex: 1;
        height: 100%;
        min-height: unset;
        border-top: none;
      }
      .toast {
        top: 80px;
        right: 24px;
        max-width: 360px;
      }
      .zone-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .app-header .stats .stat-item .label {
        display: none;
      }
      .app-header .stats .stat-item .number {
        font-size: 12px;
      }
      .zone-grid {
        grid-template-columns: 1fr;
      }
      .pharmacy-item {
        padding: 8px 10px;
      }
      .pharmacy-item .pharm-name {
        font-size: 12px;
      }
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .loading i {
      margin-right: 8px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .leaflet-tile-pane {
      filter: brightness(0.7) saturate(0.8);
    }
  </style>
</head>

    // Calcular distancia entre dos puntos (fórmula de Haversine)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Radio de la Tierra en km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // ================================================
    // 4. INICIALIZAR MAPA
    // ================================================
    const map = L.map('map', {
      center: [4.675, -74.060],
      zoom: 12,
      zoomControl: false
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ================================================
    // 5. CREAR ICONOS
    // ================================================
    function createIcon(color, size = 12) {
      return L.divIcon({
        className: 'custom-icon',
        html: `<div style="background:${color}; width:${size}px; height:${size}px; border-radius:50%; border:2px solid white; box-shadow:0 2px 6px rgba(0,0,0,0.5);"></div>`,
        iconSize: [size, size],
        iconAnchor: [size/2, size/2]
      });
    }

    // ================================================
    // 6. AGREGAR CAPAS AL MAPA
    // ================================================
    
    const zoneLayers = [];
    ZONES.forEach(zone => {
      const color = zone.priority === 'high' ? 'rgba(34, 197, 94, 0.3)' : 
                    zone.priority === 'medium' ? 'rgba(234, 179, 8, 0.3)' : 'rgba(239, 68, 68, 0.3)';
      
      const circle = L.circle([zone.lat, zone.lng], {
        radius: 500,
        color: color.replace('0.3', '0.8'),
        fillColor: color,
        fillOpacity: 0.4,
        weight: 2
      }).addTo(map);
      
      circle.bindPopup(`
        <b>${zone.name}</b><br>
        🟢 Prioridad: ${zone.priority === 'high' ? 'Alta' : zone.priority === 'medium' ? 'Media' : 'Baja'}<br>
        ⏰ Mejor hora: ${zone.bestTime}<br>
        💊 Farmacias: ${zone.pharmacies}<br>
        🏥 Clínicas: ${zone.clinics}
      `);
      
      zoneLayers.push(circle);
    });

    // Farmacias
    const pharmacyMarkers = [];
    PHARMACIES.forEach(pharm => {
      const marker = L.marker([pharm.lat, pharm.lng], {
        icon: createIcon('#3b82f6', 14)
      }).addTo(map);
      
      marker.bindPopup(`
        <b>${pharm.name}</b><br>
        📍 ${pharm.address}<br>
        <i class="fas fa-prescription"></i> Farmacia
      `);
      
      pharmacyMarkers.push(marker);
    });

    // Clínicas
    CLINICS.forEach(clinic => {
      const marker = L.marker([clinic.lat, clinic.lng], {
        icon: createIcon('#8b5cf6', 14)
      }).addTo(map);
      
      marker.bindPopup(`
        <b>${clinic.name}</b><br>
        <i class="fas fa-hospital"></i> Centro de salud
      `);
    });

    // Ciclorrutas
    CYCLE_ROUTES.forEach(route => {
      L.polyline(route.points, {
        color: '#22c55e',
        weight: 3,
        opacity: 0.6,
        dashArray: '10, 5'
      }).addTo(map).bindPopup(`
        <b>🚴 ${route.name}</b><br>
        Vía preferente para bicicletas
      `);
    });

    // ================================================
    // 7. FUNCIÓN: UBICAR USUARIO Y GENERAR RECOMENDACIONES
    // ================================================
    
    function locateUser() {
      if (navigator.geolocation) {
        // Mostrar loading
        showToast('📍 Buscando ubicación...', 'Activando GPS');
        
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            userLocation = { lat, lng };
            
            // Centrar mapa
            map.flyTo([lat, lng], 15, { duration: 1.5 });
            
            // Marcar ubicación del usuario
            if (userMarker) {
              map.removeLayer(userMarker);
            }
            userMarker = L.marker([lat, lng], {
              icon: createIcon('#ff5200', 20)
            }).addTo(map);
            userMarker.bindPopup('📍 Tu ubicación').openPopup();
            
            // Generar recomendaciones basadas en ubicación
            generateRecommendations(lat, lng);
            
            showToast('📍 Ubicación encontrada', 'Generando recomendaciones personalizadas');
          },
          () => {
            showToast('⚠️ Error', 'No se pudo obtener tu ubicación. Activa el GPS.');
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      } else {
        showToast('⚠️ Error', 'Tu navegador no soporta geolocalización');
      }
    }

    // ================================================
    // 8. GENERAR RECOMENDACIONES PERSONALIZADAS
    // ================================================
    
    function generateRecommendations(lat, lng) {
      // 1. Encontrar farmacias cercanas (radio 3 km)
      nearbyPharmacies = PHARMACIES
        .map(pharm => {
          const distance = calculateDistance(lat, lng, pharm.lat, pharm.lng);
          return { ...pharm, distance };
        })
        .filter(p => p.distance <= 3)
        .sort((a, b) => a.distance - b.distance);
      
      // 2. Encontrar zonas cercanas
      const nearbyZones = ZONES
        .map(zone => {
          const distance = calculateDistance(lat, lng, zone.lat, zone.lng);
          return { ...zone, distance };
        })
        .filter(z => z.distance <= 3)
        .sort((a, b) => a.distance - b.distance);
      
      // 3. Actualizar estadísticas
      document.getElementById('nearbyCount').textContent = nearbyPharmacies.length;
      
      // 4. Actualizar panel de zonas con recomendaciones
      renderZonesWithRecommendations(nearbyZones);
      
      // 5. Actualizar panel de farmacias con distancias
      renderPharmaciesWithDistances();
      
      // 6. Actualizar título del panel
      if (nearbyZones.length > 0) {
        document.getElementById('panelTitle').textContent = `📍 Zonas cerca de ti`;
      } else {
        document.getElementById('panelTitle').textContent = `🌍 Explora Bogotá`;
      }
      
      // 7. Agregar recomendaciones especiales
      addRecommendations(nearbyZones, nearbyPharmacies);
    }

    // ================================================
    // 9. RENDERIZAR ZONAS CON RECOMENDACIONES
    // ================================================
    
    function renderZonesWithRecommendations(nearbyZones) {
      const container = document.getElementById('sectionZones');
      
      // Si hay zonas cercanas, mostrarlas primero
      let zonesToShow = nearbyZones.length > 0 ? nearbyZones : ZONES;
      
      container.innerHTML = `
        ${nearbyZones.length > 0 ? `
          <div class="recommendation-box">
            <div class="rec-title">🎯 Recomendación personalizada</div>
            <div class="rec-body">
              Encontramos ${nearbyZones.length} zonas estratégicas a menos de 3 km de ti.
              ${nearbyZones[0] ? `La más cercana es <b>${nearbyZones[0].name}</b> a ${nearbyZones[0].distance.toFixed(2)} km.` : ''}
            </div>
          </div>
        ` : `
          <div class="recommendation-box" style="border-left-color: var(--yellow);">
            <div class="rec-title">💡 Consejo</div>
            <div class="rec-body">
              No hay zonas predefinidas cerca de ti. Explora el mapa para encontrar farmacias y clínicas cercanas.
            </div>
          </div>
        `}
        <div class="zone-grid">
          ${zonesToShow.map(zone => `
            <div class="zone-card" onclick="focusZone(${zone.lat}, ${zone.lng})" style="border-left-color: ${zone.priority === 'high' ? 'var(--green)' : zone.priority === 'medium' ? 'var(--yellow)' : 'var(--red)'};">
              <div class="zone-name">${zone.name} ${zone.distance ? `📍 ${zone.distance.toFixed(2)} km` : ''}</div>
              <div class="zone-detail">
                <i class="fas fa-clock"></i> ${zone.bestTime}
              </div>
              <div class="zone-detail">
                <i class="fas fa-prescription"></i> ${zone.pharmacies} farmacias
              </div>
              <div class="zone-detail">
                <i class="fas fa-hospital"></i> ${zone.clinics} clínicas
              </div>
              <span class="zone-badge ${zone.priority}">
                ${zone.priority === 'high' ? '🟢 Alta' : zone.priority === 'medium' ? '🟡 Media' : '🔴 Baja'}
              </span>
            </div>
          `).join('')}
        </div>
      `;
      
      document.getElementById('totalZones').textContent = zonesToShow.length;
    }

    // ================================================
    // 10. RENDERIZAR FARMACIAS CON DISTANCIAS
    // ================================================
    
    function renderPharmaciesWithDistances() {
      const container = document.getElementById('sectionPharmacies');
      
      let pharmaciesToShow = nearbyPharmacies.length > 0 ? nearbyPharmacies : PHARMACIES;
      
      container.innerHTML = `
        ${nearbyPharmacies.length > 0 ? `
          <div class="recommendation-box" style="border-left-color: var(--blue);">
            <div class="rec-title">💊 Farmacias cerca de ti</div>
            <div class="rec-body">
              ${nearbyPharmacies.length} farmacias en un radio de 3 km.
              ${nearbyPharmacies[0] ? `La más cercana es <b>${nearbyPharmacies[0].name}</b> a ${nearbyPharmacies[0].distance.toFixed(2)} km.` : ''}
            </div>
          </div>
        ` : ''}
        <div class="pharmacy-list">
          ${pharmaciesToShow.map(pharm => `
            <div class="pharmacy-item" onclick="focusPharmacy(${pharm.lat}, ${pharm.lng})">
              <div class="pharm-info">
                <div class="pharm-name">${pharm.name}</div>
                <div class="pharm-address">${pharm.address}</div>
              </div>
              <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
                ${pharm.distance ? `<span class="pharm-distance">${pharm.distance.toFixed(2)} km</span>` : ''}
                <span class="pharm-type">24h</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      
      document.getElementById('totalPharmacies').textContent = pharmaciesToShow.length;
    }

    // ================================================
    // 11. RENDERIZAR RUTAS
    // ================================================
    
    function renderRoutes() {
      const container = document.getElementById('sectionRoutes');
      container.innerHTML = `
        <div>
          ${CYCLE_ROUTES.map(route => `
            <div class="route-item">
              <div class="route-title">🚴 ${route.name}</div>
              <div class="route-detail">
                <span><i class="fas fa-flag"></i> Ruta preferente</span>
                <span><i class="fas fa-check-circle" style="color: var(--green);"></i> Ciclovía</span>
              </div>
            </div>
          `).join('')}
          <div class="route-item" style="border-left: 4px solid var(--yellow);">
            <div class="route-title">💡 Consejo de ruta</div>
            <div class="route-detail">
              <span>Conecta todas las zonas usando la ciclovía de la Kr 15 y Calle 72</span>
            </div>
          </div>
          ${userLocation ? `
            <div class="route-item" style="border-left: 4px solid var(--blue);">
              <div class="route-title">📍 Desde tu ubicación</div>
              <div class="route-detail">
                <span>Busca la ciclorruta más cercana para moverte rápido</span>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // ================================================
    // 12. AGREGAR RECOMENDACIONES ESPECIALES
    // ================================================
    
    function addRecommendations(nearbyZones, nearbyPharmacies) {
      // Si hay zonas cercanas, mostrar toast con la mejor opción
      if (nearbyZones.length > 0) {
        const bestZone = nearbyZones[0];
        setTimeout(() => {
          showToast(
            `🎯 Mejor opción: ${bestZone.name}`,
            `A ${bestZone.distance.toFixed(2)} km · ${bestZone.pharmacies} farmacias · ${bestZone.clinics} clínicas`
          );
        }, 2000);
      } else if (nearbyPharmacies.length > 0) {
        const bestPharm = nearbyPharmacies[0];
        setTimeout(() => {
          showToast(
            `💊 Farmacia más cercana`,
            `${bestPharm.name} a ${bestPharm.distance.toFixed(2)} km`
          );
        }, 2000);
      }
    }

    // ================================================
    // 13. FUNCIONES DE NAVEGACIÓN
    // ================================================
    
    window.focusZone = function(lat, lng) {
      map.flyTo([lat, lng], 15, { duration: 1.5 });
      showToast('📍 Zona seleccionada', 'Acércate a esta área para mayor afluencia de pedidos');
    };

    window.focusPharmacy = function(lat, lng) {
      map.flyTo([lat, lng], 16, { duration: 1.5 });
      showToast('💊 Farmacia cercana', 'Ubícate cerca para recibir pedidos de farmacia');
    };

    window.resetMapView = function() {
      map.flyTo([4.675, -74.060], 12, { duration: 1 });
      // Restaurar vista normal
      if (userLocation) {
        generateRecommendations(userLocation.lat, userLocation.lng);
      } else {
        renderZonesWithRecommendations([]);
        renderPharmaciesWithDistances();
        document.getElementById('panelTitle').textContent = '🌍 Explora Bogotá';
      }
    };

    window.toggleHeatmap = function() {
      const pane = document.querySelector('.leaflet-tile-pane');
      isHeatmapActive = !isHeatmapActive;
      if (isHeatmapActive) {
        pane.style.filter = 'brightness(0.6) saturate(1.5) contrast(1.2)';
        showToast('🔥 Modo calor activado', 'Zonas más cálidas = mayor densidad');
      } else {
        pane.style.filter = 'brightness(0.7) saturate(0.8)';
        showToast('🌙 Modo normal', 'Visualización estándar');
      }
    };

    // ================================================
    // 14. TOAST / NOTIFICACIONES
    // ================================================
    let toastTimeout;

    function showToast(title, body) {
      const toast = document.getElementById('toast');
      document.querySelector('.toast-title').innerHTML = `<i class="fas fa-bell"></i> ${title}`;
      document.getElementById('toastBody').textContent = body;
      toast.classList.add('show');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 5000);
    }

    // ================================================
    // 15. CONTROLES DE VISTA
    // ================================================
    
    document.querySelectorAll('.view-toggle button').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        
        const view = this.dataset.view;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('section' + view.charAt(0).toUpperCase() + view.slice(1)).classList.add('active');
      });
    });

    // ================================================
    // 16. NAVEGACIÓN BOTTOM
    // ================================================
    document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.bottom-nav .nav-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
        
        const label = this.querySelector('span')?.textContent;
        if (label === 'Zonas Calientes') {
          map.flyTo([4.685, -74.048], 13, { duration: 1 });
          showToast('🔥 Zonas Calientes', 'Chapinero, Chicó y Calle 100 tienen mayor demanda');
        } else if (label === 'Rutas') {
          map.flyTo([4.675, -74.060], 13, { duration: 1 });
          showToast('🚴 Rutas óptimas', 'Usa la ciclovía de Kr 15 para moverte rápido');
          // Cambiar a vista de rutas
          document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
          document.querySelector('[data-view="routes"]').classList.add('active');
          document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
          document.getElementById('sectionRoutes').classList.add('active');
        } else if (label === 'Estadísticas') {
          showToast('📊 Estadísticas', 
            userLocation ? 
            `Tienes ${nearbyPharmacies.length} farmacias cerca` : 
            'Usa "Mi Ubicación" para ver estadísticas personalizadas'
          );
        } else {
          map.flyTo([4.675, -74.060], 12, { duration: 1 });
          // Cambiar a vista de zonas
          document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
          document.querySelector('[data-view="zones"]').classList.add('active');
          document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
          document.getElementById('sectionZones').classList.add('active');
          if (userLocation) {
            generateRecommendations(userLocation.lat, userLocation.lng);
          }
        }
      });
    });

    // ================================================
    // 17. INICIAR APP
    // ================================================
    function initApp() {
      renderZonesWithRecommendations([]);
      renderPharmaciesWithDistances();
      renderRoutes();
      
      setTimeout(() => {
        showToast('🚴‍♂️ DiDi Farma Navigator', 'Presiona 📍 para recomendaciones personalizadas');
      }, 1000);
      
      // Intentar obtener ubicación automáticamente (con permiso del usuario)
      if ('geolocation' in navigator) {
        setTimeout(() => {
          locateUser();
        }, 3000);
      }
      
      console.log('✅ DiDi Farma Navigator iniciado');
    }

    // ================================================
    // 18. ACTUALIZAR CADA 5 MINUTOS
    // ================================================
    setInterval(() => {
      if (userLocation) {
        generateRecommendations(userLocation.lat, userLocation.lng);
        console.log('🔄 Recomendaciones actualizadas');
      }
    }, 300000);

    // Iniciar la app
    initApp();

    console.log('💡 Consejo: Usa el botón 📍 para recomendaciones personalizadas');
  </script>
</body>
</html>
